name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: |
          curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
          sudo apt-get install git-lfs

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Clone Hugging Face Space
        run: |
          git clone https://huggingface.co/spaces/${HF_SPACE_ID} huggingface-space
          cd huggingface-space
          git fetch --all
          git reset --hard origin/main

      - name: Copy files to Space
        run: |
          rsync -av --exclude='huggingface-space' --exclude='.git' --exclude='.gitattributes' . huggingface-space/
          cd huggingface-space
          git lfs install
          git lfs track "*.png"
          git lfs track "*.webp"
          git lfs track "*.m4a"
          git lfs track "*.mp3"
          git lfs track "*.wav"
          git lfs track "*.ogg"
          # Add HUGGING_FACE environment variable for cloud optimizations
          echo "HUGGING_FACE=1" >> .env
          git add .
          git add .gitattributes
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git commit -m "Deploy from GitHub Actions"

      - name: Push to Hugging Face Space
        run: |
          cd huggingface-space
          git remote set-url origin https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}
          git lfs push origin main --all
          git push origin main
